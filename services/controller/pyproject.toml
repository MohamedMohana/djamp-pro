[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "djamp-controller"
version = "1.2.10"
description = "DJAMP PRO controller service"
authors = [{ name = "DJAMP PRO Team" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.24.0",
  "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.15.6,<0.18",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Select the rule set explicitly instead of relying on ruff's default. ruff
# 0.16 turned on ~350 additional rules by default, so leaving this implicit
# means a ruff upgrade silently changes what CI enforces and breaks unrelated
# pull requests. Widen this list deliberately, not by upgrading ruff.
select = ["E4", "E7", "E9", "F"]
